name: CI

# Compiles, runs the test suite (against a PostgreSQL service like the local one) and
# builds the Docker image on every push. The image is published to GitHub Container
# Registry ONLY when a version tag such as v0.1.0 is pushed.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The integration tests only accept a database whose name ends in -test.
          POSTGRES_DB: shareway-booking-pricing-test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: postgres
      TEST_DB_URL: jdbc:postgresql://localhost:5432/shareway-booking-pricing-test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

      - name: Image tag (pom version + short commit hash)
        if: github.event_name == 'push'
        id: image
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version | grep -v '\[INFO\]')
          HASH=$(git rev-parse --short HEAD)
          echo "tag=${VERSION}-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Build the image
        if: github.event_name == 'push'
        run: docker build -t "ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}" .

      - name: Publish the image (only on version tags, e.g. v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
