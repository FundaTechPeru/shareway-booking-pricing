spring.application.name=shareway-booking-pricing

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shareway-booking-pricing}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

pricing.platform-fee-percent=${PRICING_PLATFORM_FEE_PERCENT:10}
booking.reservation.max-attempts=${BOOKING_RESERVATION_MAX_ATTEMPTS:3}
booking.reservation.backoff-ms=${BOOKING_RESERVATION_BACKOFF_MS:20}
booking.timezone=${BOOKING_TIMEZONE:America/Lima}
booking.cancellation.penalty-window-minutes=${BOOKING_CANCELLATION_PENALTY_WINDOW_MINUTES:30}
booking.saga.payment-timeout-minutes=${BOOKING_SAGA_PAYMENT_TIMEOUT_MINUTES:10}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
