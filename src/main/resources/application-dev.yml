# Local development: activate with --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev).
# Every value below is a LOCAL DEFAULT; a real environment variable still wins because the
# placeholders are read as ${VAR:default}. The optional .env file is imported only here, so
# the cloud profile never loads it.
spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/shareway_booking}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:}"

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: "${SERVER_PORT:8080}"

# Development example secret shared with Driver Management, Trip Planning and Payments; it is
# rejected outside the dev, test and local profiles. INTERNAL_API_KEY falls back in code to the
# shared development key in this profile.
app:
  jwt:
    secret: "${JWT_SECRET:dev-only-shareway-driver-management-secret-change-me}"
  # Locally the outbox is kept and NOT sent to the Render services; set OUTBOX_RELAY_ENABLED=true
  # to send it.
  outbox:
    relay-enabled: "${OUTBOX_RELAY_ENABLED:false}"
