# Base configuration, shared by every profile. Nothing environment-specific lives here:
# DB_URL, DB_USER, DB_PASSWORD and SERVER_PORT are read from environment variables with no
# default value. Only application-dev.yml supplies local defaults; application-prod.yml keeps
# the cloud values coming exclusively from the environment.
spring:
  application:
    name: shareway-booking-pricing

  datasource:
    url: "${DB_URL}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    clean-disabled: true

server:
  port: "${SERVER_PORT}"

# Actuator: only health and info are exposed, with liveness/readiness probes enabled
# (/actuator/health/liveness and /actuator/health/readiness). Details stay hidden.
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ShareWay Booking & Pricing
    description: Booking, seats, booking saga, fare rules and penalties service.

booking:
  reservation:
    max-attempts: "${BOOKING_RESERVATION_MAX_ATTEMPTS:3}"
    backoff-ms: "${BOOKING_RESERVATION_BACKOFF_MS:20}"
  cancellation:
    penalty-window-minutes: "${BOOKING_CANCELLATION_PENALTY_WINDOW_MINUTES:30}"
    penalty-percent: "${BOOKING_CANCELLATION_PENALTY_PERCENT:20}"
    minimum-penalty-amount: "${BOOKING_CANCELLATION_MINIMUM_PENALTY_AMOUNT:1.00}"
  saga:
    payment-timeout-minutes: "${BOOKING_SAGA_PAYMENT_TIMEOUT_MINUTES:15}"
    group-timeout-minutes: "${BOOKING_SAGA_GROUP_TIMEOUT_MINUTES:60}"
    driver-timeout-minutes: "${BOOKING_SAGA_DRIVER_TIMEOUT_MINUTES:30}"
    timeout-job-enabled: "${BOOKING_SAGA_TIMEOUT_JOB_ENABLED:true}"
    timeout-job-cron: "${BOOKING_SAGA_TIMEOUT_JOB_CRON:0 * * * * *}"
  departure:
    simulated-offset-minutes: "${BOOKING_DEPARTURE_SIMULATED_OFFSET_MINUTES:120}"

# --- ShareWay integration -------------------------------------------------------------------
app:
  # HS256 access tokens issued by Driver Management, signed with the JWT_SECRET shared by every
  # ShareWay service. Outside the dev, test and local profiles the service refuses to start
  # without a JWT_SECRET of at least 32 characters (see JwtSecretValidator).
  jwt:
    secret: "${JWT_SECRET:}"
  # Calls between ShareWay services carry the X-Internal-Api-Key header. Outside the dev, test
  # and local profiles the service refuses to start when INTERNAL_API_KEY is missing or is the
  # shared development value; inside them the development value is used when it is not set.
  internal:
    api-key: "${INTERNAL_API_KEY:}"
  integration:
    payments-url: "${PAYMENTS_URL:https://shareway-payments-settlement-service.onrender.com}"
    trip-execution-url: "${TRIP_EXECUTION_URL:https://shareway-trip-execution.onrender.com}"
    # Free Render services can take up to a minute to wake up.
    timeout: 90s
  # Transactional outbox of the calls to Payments and Trip Execution.
  outbox:
    relay-enabled: "${OUTBOX_RELAY_ENABLED:true}"
    poll-interval: 5s
    batch-size: 50
    initial-backoff: 5s
    max-backoff: 5m

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
