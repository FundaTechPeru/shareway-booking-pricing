spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/shareway-booking-pricing-test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=30
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=false
# The saga timeout job stays off in tests: they call SagaTimeoutService directly.
booking.saga.timeout-job-enabled=false
# The base file requires SERVER_PORT from the environment; tests do not use a fixed port
# (@SpringBootTest RANDOM_PORT sets server.port=0 itself).
server.port=${SERVER_PORT:0}
# Tokens of the tests are signed with the development example secret (see TestTokens).
app.jwt.secret=dev-only-shareway-driver-management-secret-change-me
# The outbox relay never runs on its own in tests: they call OutboxRelay directly, and the
# remote services point to a closed local port unless a test starts a simulated server.
app.outbox.relay-enabled=false
app.outbox.initial-backoff=1s
app.integration.payments-url=http://localhost:1
app.integration.trip-execution-url=http://localhost:1
app.integration.timeout=5s
