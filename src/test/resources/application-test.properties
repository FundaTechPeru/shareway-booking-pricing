spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/shareway-booking-pricing-test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=30
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=false
# The base file requires SERVER_PORT from the environment; tests do not use a fixed port
# (@SpringBootTest RANDOM_PORT sets server.port=0 itself).
server.port=${SERVER_PORT:0}
